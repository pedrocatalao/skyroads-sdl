name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: macOS (universal .app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: skyroads-data-v1
      - name: Build SkyRoads.app
        run: ./make_mac.sh
      - name: Verify universal binary
        run: lipo -archs build/SkyRoads.app/Contents/MacOS/skyroads | grep -q "x86_64 arm64"
      - name: Zip app (preserving symlinks)
        run: cd build && zip -r -y skyroads-macos-universal.zip SkyRoads.app
      - name: DXM core builds (SKY_CORE=ON)
        # Compile-only, and deliberately a SEPARATE build tree: this is the
        # library DXM links, so it must build with no SDL and no threading
        # library of its own on every platform the standalone supports.
        # It compiles against the VENDORED src/dxm_core.h - this repo is
        # public and DXM's is not, so CI cannot check DXM out to borrow it.
        run: |
          cmake -S . -B build-core -DSKY_CORE=ON
          cmake --build build-core --target skyroads_core
      - uses: actions/upload-artifact@v4
        with:
          name: skyroads-macos-universal
          path: build/skyroads-macos-universal.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/skyroads-macos-universal.zip --clobber
