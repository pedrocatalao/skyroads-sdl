name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # one arch failing must not cancel the other
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev curl unzip
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: skyroads-data-v1
      - name: Build (make_linux.sh)
        run: ./make_linux.sh
      - name: Engine smoke test (physics sim)
        run: |
          cmake --build build --target game_sim -j
          ./build/game_sim data | grep -q "SIM OK"
      - name: Build the DXM core module
        # A SEPARATE build tree: this is the game as DXM consumes it, so it
        # must build with no SDL and no threading library of its own on every
        # platform the standalone supports.  It compiles against the VENDORED
        # src/dxm_core.h - this repo is public and DXM's is not, so CI cannot
        # check DXM out to borrow it.
        run: |
          cmake -S . -B build-core -DSKY_CORE=ON -DSKY_MODULE=ON
          cmake --build build-core
      - name: Verify the module is self-contained
        # A module that expects the host to supply a symbol fails at dlopen,
        # in front of the user.  Catch it here instead.
        run: |
          test -f build-core/skyroads.dxm
          nm -D --undefined-only build-core/skyroads.dxm | grep -E " (plat_|SDL_|pthread_)" && exit 1
          nm -D --defined-only build-core/skyroads.dxm | grep -c " T dxm_core_" | grep -qx 3
          echo "self-contained, 3 entry points"
      - uses: actions/upload-artifact@v4
        with:
          name: skyroads-dxm-linux-${{ matrix.arch }}
          path: build-core/skyroads.dxm
      - name: Attach module to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build-core/skyroads.dxm "skyroads-linux-${{ matrix.arch }}.dxm"
          gh release upload "${{ github.event.release.tag_name }}" \
            "skyroads-linux-${{ matrix.arch }}.dxm" --clobber
      - name: Package (binary + game data + bundled SDL2)
        run: |
          mkdir -p dist/skyroads/lib
          cp build/skyroads dist/skyroads/
          cp -r data dist/skyroads/data
          # bundle the SDL2 the binary linked against ($ORIGIN/lib rpath)
          sdl2=$(ldd build/skyroads | awk '/libSDL2/ {print $3}')
          test -n "$sdl2"
          cp -L "$sdl2" dist/skyroads/lib/
          tar -czf "skyroads-linux-${{ matrix.arch }}.tar.gz" -C dist skyroads
      - uses: actions/upload-artifact@v4
        with:
          name: skyroads-linux-${{ matrix.arch }}
          path: skyroads-linux-${{ matrix.arch }}.tar.gz
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "skyroads-linux-${{ matrix.arch }}.tar.gz" --clobber
