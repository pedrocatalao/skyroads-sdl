name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # one arch failing must not cancel the other
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev curl unzip
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: skyroads-data-v1
      - name: Build (make_linux.sh)
        run: ./make_linux.sh
      - name: Engine smoke test (physics sim)
        run: |
          cmake --build build --target game_sim -j
          ./build/game_sim data | grep -q "SIM OK"
      - name: Checkout DOS ex Machina (for dxm_core.h)
        uses: actions/checkout@v4
        with:
          repository: pedrocatalao/dosexmachina
          path: .dxm
      - name: DXM core builds (SKY_CORE=ON)
        # Compile-only, and deliberately a SEPARATE build tree: this is the
        # library DXM links, so it must build with no SDL and no threading
        # library of its own on every platform the standalone supports.
        # It also doubles as a contract check - if dxm_core.h changes under
        # us, this is where we find out.  The include path is RELATIVE on
        # purpose: Windows runs these steps under msys2 bash, where an
        # expanded ${{ github.workspace }} is a backslash path, and CMake
        # resolves a relative include against the source dir anyway.
        run: |
          cmake -S . -B build-core -DSKY_CORE=ON -DSKY_DXM_INCLUDE=.dxm/src
          cmake --build build-core --target skyroads_core
      - name: Package (binary + game data + bundled SDL2)
        run: |
          mkdir -p dist/skyroads/lib
          cp build/skyroads dist/skyroads/
          cp -r data dist/skyroads/data
          # bundle the SDL2 the binary linked against ($ORIGIN/lib rpath)
          sdl2=$(ldd build/skyroads | awk '/libSDL2/ {print $3}')
          test -n "$sdl2"
          cp -L "$sdl2" dist/skyroads/lib/
          tar -czf "skyroads-linux-${{ matrix.arch }}.tar.gz" -C dist skyroads
      - uses: actions/upload-artifact@v4
        with:
          name: skyroads-linux-${{ matrix.arch }}
          path: skyroads-linux-${{ matrix.arch }}.tar.gz
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "skyroads-linux-${{ matrix.arch }}.tar.gz" --clobber
