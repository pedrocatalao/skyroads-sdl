name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  macos:
    name: macOS (universal .app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: skyroads-data-v1
      - name: Build SkyRoads.app
        run: ./make_mac.sh
      - name: Verify universal binary
        run: lipo -archs build/SkyRoads.app/Contents/MacOS/skyroads | grep -q "x86_64 arm64"
      - name: Zip app (preserving symlinks)
        run: cd build && zip -r -y SkyRoads.zip SkyRoads.app
      - uses: actions/upload-artifact@v4
        with:
          name: SkyRoads-macOS
          path: build/SkyRoads.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/SkyRoads.zip --clobber

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsdl2-dev curl unzip
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: skyroads-data-v1
      - name: Build (make_linux.sh)
        run: ./make_linux.sh
      - name: Engine smoke test (physics sim)
        run: |
          cmake --build build --target game_sim -j
          ./build/game_sim data | grep -q "SIM OK"
      - name: Package (binary + game data)
        run: |
          mkdir -p dist/skyroads
          cp build/skyroads dist/skyroads/
          cp -r data dist/skyroads/data
          tar -czf "skyroads-linux-${{ matrix.arch }}.tar.gz" -C dist skyroads
      - uses: actions/upload-artifact@v4
        with:
          name: skyroads-linux-${{ matrix.arch }}
          path: skyroads-linux-${{ matrix.arch }}.tar.gz
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "skyroads-linux-${{ matrix.arch }}.tar.gz" --clobber
