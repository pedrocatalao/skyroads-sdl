name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write        # needed to attach assets on release events

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false     # one arch failing must not cancel the other
      matrix:
        include:
          - { runner: windows-latest, arch: x86_64, msystem: UCRT64,     prefix: mingw-w64-ucrt-x86_64 }
          - { runner: windows-11-arm, arch: arm64,  msystem: CLANGARM64, prefix: mingw-w64-clang-aarch64 }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # no `update:` — the pinned base install is fine for CI and much
          # faster; the action's built-in cache (default on) does the rest
          install: >-
            git curl unzip zip
            ${{ matrix.prefix }}-cc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-SDL2
      - name: Cache game data
        uses: actions/cache@v4
        with:
          path: data
          key: skyroads-data-v1
      - name: Fetch game data
        run: ./get_data.sh data
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target skyroads
      - name: Engine smoke test (physics sim)
        run: |
          cmake --build build --target game_sim
          ./build/game_sim data | grep -q "SIM OK"
      - name: Package (exe + DLLs + game data)
        run: |
          mkdir -p dist/skyroads
          cp build/skyroads.exe dist/skyroads/
          # bundle every non-system DLL the exe needs (SDL2 + MinGW runtime)
          ldd build/skyroads.exe | grep -iv "system32" | awk '{print $3}' | sort -u | xargs -I{} cp {} dist/skyroads/
          cp -r data dist/skyroads/data
          cd dist && zip -r "../skyroads-windows-${{ matrix.arch }}.zip" skyroads
      - name: Build the DXM core module
        # A SEPARATE build tree: this is the game as DXM consumes it, so it
        # must build with no SDL and no threading library of its own on every
        # platform the standalone supports.  It compiles against the VENDORED
        # src/dxm_core.h - this repo is public and DXM's is not, so CI cannot
        # check DXM out to borrow it.
        run: |
          cmake -S . -B build-core -DSKY_CORE=ON -DSKY_MODULE=ON
          cmake --build build-core
      - name: Verify the module is self-contained
        run: |
          test -f build-core/skyroads.dxm
          echo "built skyroads.dxm"
      - uses: actions/upload-artifact@v4
        with:
          name: skyroads-dxm-windows-${{ matrix.arch }}
          path: build-core/skyroads.dxm
      - name: Attach module to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build-core/skyroads.dxm "skyroads-windows-${{ matrix.arch }}.dxm"
          gh release upload "${{ github.event.release.tag_name }}" \
            "skyroads-windows-${{ matrix.arch }}.dxm" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: skyroads-windows-${{ matrix.arch }}
          path: skyroads-windows-${{ matrix.arch }}.zip
      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash          # runner's own bash — gh isn't on the MSYS2 PATH
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "skyroads-windows-${{ matrix.arch }}.zip" --clobber
